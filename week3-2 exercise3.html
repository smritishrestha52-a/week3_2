<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8">
<style>
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 200px;
    background: #f0fdfa;
  }

  @keyframes spin {
    from {
      transform: rotate(0deg);
    }
    to {
      transform: rotate(360deg);
    }
  }

  .spinner {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    border: 7rem solid #ecccfb;
    border-top-color: #0f766e;
    animation: spin cubic-bezier(0.215, 0.610, 0.355, 1) linear infinite;
  }
</style>
</head>
<body>
  <div class="spinner"></div>
</body>
</html>
