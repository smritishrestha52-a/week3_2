<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      padding: 40px;
      background: #f0fdfa;
      font-family: Arial, sans-serif;
    }

    .card {
      background: rgba(255, 255, 255, 0.829);
      border: 2px solid #14b8a5b5;
      border-radius: 16px;
      padding: 24px;
      width: 240px;
      color: #65760fc1;
      font-size: 18px;
      text-align: center;
      transition: all 0.3s ease;
    }

    .card:hover {
      transform: translateY(-6px) scale(1.03);
      background: #ecfdf5;
      box-shadow: 0 12px 28px rgba(15, 118, 18, 0.61);
    }
  </style>
</head>
<body>
  <div class="card">✨ Hover over me!</div>
</body>
</html>
